<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
<title>kasb.net — Kasb bilan imkoniyatlar bir joyda</title>
<style>
:root{--teal:#01A9AE;--navy:#03306C;--bg:#F5F8FA;--surf:#fff;--tx:#000;--mu:#5B6B7B;--bd:#DCE4EA;--tint:#E6F6F6;--ok:#2F8F5B;--warn:#B7791F;--glass:rgba(255,255,255,.62);--gb:rgba(255,255,255,.9);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#061326;--surf:#0A1D38;--tx:#F2F6F9;--mu:#9DB0C3;--bd:#1B3558;--tint:#0B3347;--navy:#8FB8F0;--glass:rgba(10,29,56,.58);--gb:rgba(143,184,240,.2);color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(60% 45% at 12% 0%,rgba(1,169,174,.24),transparent),radial-gradient(50% 40% at 92% 8%,rgba(3,48,108,.2),transparent),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.55 "Poppins",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{color:var(--navy);margin:0;letter-spacing:-.02em;line-height:1.1}
h1{font-size:clamp(34px,6vw,64px);font-weight:700;letter-spacing:-.03em}h2{font-size:clamp(24px,3.5vw,34px)}h3{font-size:17px;letter-spacing:-.01em;line-height:1.3}
a{color:inherit;text-decoration:none}.w{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:12px;z-index:20;margin:12px auto 0;width:calc(100% - 24px);max-width:1120px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--gb);box-shadow:0 8px 30px rgba(3,48,108,.1)}
.panel{border-radius:40px;padding:clamp(24px,5vw,56px);position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(1,169,174,.18),rgba(3,48,108,.12));border:1px solid var(--gb)}.panel:before{content:"";position:absolute;width:440px;height:440px;right:-130px;top:-150px;border-radius:50%;background:radial-gradient(circle,rgba(1,169,174,.35),transparent 70%)}.panel>*{position:relative}
.rail{position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--gb);box-shadow:0 8px 30px rgba(3,48,108,.1)}.rail a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--navy)}.rail a.on,.rail a:hover{background:var(--teal);color:#fff}@media(max-width:1280px){.rail{display:none}}
#modal .card{background:var(--surf)}
.nav{display:flex;align-items:center;gap:20px;height:60px}.logo img{display:block;height:30px;width:auto}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) header .logo{background:#fff;border-radius:999px;padding:5px 14px}}.logo{font-weight:800;font-size:20px;color:var(--navy);letter-spacing:-.03em}.logo b{color:var(--teal)}
.nav nav{display:flex;gap:18px;flex:1;overflow-x:auto;white-space:nowrap}.nav nav a{color:var(--mu);font-weight:500;padding:4px 0;border-bottom:2px solid transparent}.nav nav a.on,.nav nav a:hover{color:var(--navy);border-color:var(--teal)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:10px 20px;font:600 14px inherit;font-family:inherit;cursor:pointer;background:var(--teal);color:#fff}
.btn:hover{filter:brightness(.93)}.btn.s{background:var(--navy);color:#fff}.btn.g{background:transparent;border-color:var(--bd);color:var(--navy)}.btn.sm{padding:6px 12px;font-size:13px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.s{background:#8FB8F0;color:#03306C}}
section{padding:56px 0}.card{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--gb);border-radius:28px;padding:22px;box-shadow:0 10px 30px rgba(3,48,108,.08)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.mu{color:var(--mu)}.sm{font-size:13px}.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--tint);color:var(--navy);font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.ok{color:var(--ok)}.vb{background:#E3F4EB;color:#1F6B43}.ai{background:#FDF3DD;color:#8A5A0B}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .vb{background:#12372A;color:#7FD3A5}:root:not([data-theme=light]) .ai{background:#3A2C0E;color:#E9B863}}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--gb);border-radius:16px;background:var(--glass);color:var(--tx);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:-1px}
.av{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}@media(max-width:820px){.hero{grid-template-columns:1fr}}
.stack{position:relative;display:grid;gap:12px}.stack .card{box-shadow:0 1px 0 var(--bd)}
.ms{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}.dot{width:10px;height:10px;border-radius:50%;background:var(--bd)}.dot.d{background:var(--teal)}
.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy)}
details{border-bottom:1px solid var(--bd);padding:14px 0}summary{cursor:pointer;font-weight:600;color:var(--navy)}
.cover{height:150px;border-radius:0;background:linear-gradient(120deg,#03306C,#01A9AE 160%)}
#modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:50;padding:16px}#modal.on{display:grid}#modal .card{max-width:460px;width:100%}
footer{background:var(--navy);color:#cfe0f3;padding:44px 0;margin:40px 12px 12px;border-radius:36px}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) footer{background:#020b17}}footer a{display:block;padding:2px 0}
.step{display:flex;gap:14px;padding:10px 0}.step i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--navy);display:grid;place-items:center;font-weight:700;flex:none}
html{scroll-behavior:smooth}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes orb{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,34px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(1,169,174,.5)}70%{box-shadow:0 0 0 8px rgba(1,169,174,0)}100%{box-shadow:0 0 0 0 rgba(1,169,174,0)}}
#app.pg{animation:fade .5s ease}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.22,.8,.3,1) calc(var(--i,0)*70ms),transform .7s cubic-bezier(.22,.8,.3,1) calc(var(--i,0)*70ms)}
.rv.in{opacity:1;transform:none}
.rv.done{transition:transform .3s cubic-bezier(.22,.8,.3,1),box-shadow .3s,opacity .3s}
a.card.done:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(3,48,108,.16)}
.hero h1{animation:up .8s .05s both}.hero>div:first-child>p{animation:up .8s .2s both}.hero>div:first-child>.row{animation:up .8s .35s both}
.stack .card:nth-child(1){animation:up .9s .25s both,fl 7s ease-in-out 1.3s infinite}.stack .card:nth-child(2){animation:up .9s .45s both,fl 8s ease-in-out 1.6s infinite reverse}
.panel:before{animation:orb 14s ease-in-out infinite}
.btn{transition:transform .2s,filter .2s,background .2s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.tag{transition:background .2s,transform .2s}a.tag:hover{background:var(--teal);color:#fff;transform:translateY(-1px)}
.nav nav a{transition:color .2s,border-color .2s}.rail a{transition:background .2s,color .2s,transform .2s}.rail a:hover{transform:scale(1.12)}
header{transition:box-shadow .3s}header.sc{box-shadow:0 14px 40px rgba(3,48,108,.2)}
.dot.d{animation:pulse 2s infinite}
#modal.on{animation:fade .25s}#modal.on .card{animation:pop .35s cubic-bezier(.22,.8,.3,1)}
details[open]>p{animation:up .4s}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}

pricing(){return `<section><div class="w" style="max-width:820px"><h1 style="margin-bottom:12px">Narxlar</h1><p class="mu">Mijoz komissiyasi taxminan 3%, ijrochi komissiyasi taxminan 5–7%. Yakuniy stavkalar to’lov provayderi bilan shartnomaga bog’liq va o’zgarishi mumkin.</p><div class="card" style="margin-top:20px"><h3>Namunaviy hisob-kitob</h3><div class="row" style="margin:12px 0"><input id="bud" type="number" min="0" step="100000" value="5000000" style="width:200px"><span class="mu">so’m byudjet</span><select id="fee"><option value="5">Ijrochi: 5%</option><option value="6" selected>Ijrochi: 6%</option><option value="7">Ijrochi: 7%</option></select></div><div id="calc"></div></div></div></section>`}};

const G={cat:''};
function lst(){const q=$('#q').value.toLowerCase(),c=$('#c').value,b=+$('#bg').value,s=$('#so').value;G.cat=c;let a=P.filter(p=>(!q||(p.t+p.x+p.s).toLowerCase().includes(q))&&(!c||p.c==c)&&(!b||(b==3000000?p.b<=b:p.b>3000000)));if(s=='b')a.sort((x,y)=>y.b-x.b);if(s=='p')a.sort((x,y)=>x.n-y.n);$('#lst').innerHTML=a.length?a.map(pc).join(''):'<div class="card mu">Hech narsa topilmadi. Filtrlarni o’zgartiring.</div>'}

function calc(){const b=Math.max(0,+$('#bud').value||0),f=+$('#fee').value,cf=Math.round(b*.03),ff=Math.round(b*f/100);$('#calc').innerHTML=`<div class="ms sp"><span>Mijoz to’laydi (byudjet + 3%)</span><span class="num" style="margin-left:auto">${uz(b+cf)}</span></div><div class="ms"><span>Ijrochi oladi (byudjet − ${f}%)</span><span class="num" style="margin-left:auto">${uz(b-ff)}</span></div><div class="ms"><span>Platforma daromadi (taxminiy)</span><span class="num" style="margin-left:auto">${uz(cf+ff)}</span></div>`}
function modal(h){$('#mc').innerHTML=h;$('#modal').classList.add('on')}function closeM(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};
function auth(t){if(t[0]=='R')return reg();modal(`<h3>${t}</h3><p class="mu sm">Haqiqiy Telegram kirishi keyinroq ulanadi. Hozir hech qanday akkaunt yaratilmaydi.</p><button class="btn" onclick="closeM()">Tushunarli</button>`)}

async function regGo(){const n=$('#rn').value.trim(),p=$('#rp').value.trim(),e=$('#re');if(!G.role)return e.textContent='Rolingizni tanlang.';if(n.length<3)return e.textContent='Ism familiyani kiriting.';if(p.length<5)return e.textContent='Telefon yoki Telegram kiriting.';if(!$('#rc').checked)return e.textContent='Shartlarni tasdiqlang.';
try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,contact:p,role:G.role==1?'client':'freelancer'})});const j=await r.json().catch(()=>({}));if(!r.ok)return e.textContent=j.error||'Xatolik yuz berdi';
U={n:j.user.name,role:G.role,token:j.token};try{localStorage.setItem('kasb',JSON.stringify(U))}catch(x){}hdr();const to=G.role==1?'freelancers':'projects';

async function sent(){const t=$('#pt').value.trim(),price=+$('#pa').value,pe=$('#pe');if(!t){$('#pt').style.borderColor='#C0392B';$('#pt').placeholder='Iltimos, qisqa xat yozing';return}if(!(price>0)){pe.textContent='Narxni kiriting.';return}

function route(){const h=location.hash.slice(1)||'home',[v,...r]=h.split('-'),id=r.join('-');$('#app').innerHTML=(views[v]||nf)(id);document.querySelectorAll('.nav nav a,.rail a').forEach(a=>a.classList.toggle('on',a.dataset.v==v));scrollTo(0,0);

{const r=route,l=lst,f=fl;route=()=>{r();const a=$('#app');a.classList.remove('pg');void a.offsetWidth;a.classList.add('pg');fx()};lst=()=>{l();fx()};fl=()=>{f();fx()}}
addEventListener('scroll',()=>document.querySelector('header').classList.toggle('sc',scrollY>10),{passive:true});
addEventListener('hashchange',route);if(U)hdr();load().then(route).catch(()=>{$('#app').innerHTML='<section><div class="w"><div class="card">Server bilan aloqa yo’q. Saytni http://127.0.0.1:3001 orqali oching.</div></div></section>'});
